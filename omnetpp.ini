[General]
network = AodvMobilityNetwork
sim-time-limit = 100s
seed-set = 41
num-rngs = 3
**.mobility.rng-0 = 1
**.wlan[*].mac.rng-0 = 2

# Keep animation readable rather than racing through route discovery.
cmdenv-express-mode = false
record-eventlog = true

# AODV owns the routes; the configurator assigns addresses only.
*.configurator.addStaticRoutes = false
*.configurator.addDefaultRoutes = false
*.configurator.addSubnetRoutes = false
**.netmaskRoutes = ""
**.arp.typename = "GlobalArp"
*.*.routingApp.typename = "Aodv"
*.*.routingApp.activeRouteTimeout = 2s
*.*.routingApp.deletePeriod = 3s
*.*.routingApp.helloInterval = 1s
*.*.routingApp.allowedHelloLoss = 2

# Deterministic, easy-to-understand wireless range model.
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"
**.wlan[*].typename = "AckingWirelessInterface"
**.wlan[*].bitrate = 6Mbps
**.wlan[*].mac.headerLength = 23B
**.wlan[*].radio.typename = "GenericRadio"
**.wlan[*].radio.signalAnalogRepresentation = "unitDisk"
**.wlan[*].radio.transmitter.headerLength = 96b
**.wlan[*].radio.transmitter.analogModel.communicationRange = 250m
**.wlan[*].radio.transmitter.analogModel.interferenceRange = 300m
**.wlan[*].radio.transmitter.analogModel.detectionRange = 330m
**.wlan[*].radio.receiver.ignoreInterference = true

# Application: continuous traffic exposes interruption and recovery.
*.host[0].numApps = 1
*.host[0].app[0].typename = "PingApp"
*.host[0].app[0].destAddr = "host[9](ipv4)"
*.host[0].app[0].startTime = 2s
*.host[0].app[0].sendInterval = 0.6s
*.host[0].app[0].packetSize = 256B
*.host[0].app[0].hopLimit = 32
*.host[0].app[0].printPing = true

# Student-facing results. PingApp already provides sent/received/lost and RTT;
# ManetMetrics adds destination-side delivery, one-way delay, hop count, PDR,
# and the longest reception gap during mobility-driven route reconstruction.
**.scalar-recording = true
**.vector-recording = false
*.host[0].app[0].rtt.vector-recording = true
*.metrics.destinationDelay.vector-recording = true
*.metrics.destinationHopCount.vector-recording = true

# Roles and colors are visible at a glance.
*.host[0].display-name = "SOURCE"
*.host[0].display-string = "i=device/wifilaptop,red"
*.host[9].display-name = "DESTINATION"
*.host[9].display-string = "i=device/wifilaptop,green"
*.host[2].display-name = "MOVING RELAY"
*.host[2].display-string = "i=device/wifilaptop,yellow"
*.host[1].display-name = "CENTRAL-1"
*.host[3].display-name = "CENTRAL-3"
*.host[4].display-name = "BYPASS-1"
*.host[5].display-name = "BYPASS-2"
*.host[6].display-name = "BYPASS-3"
*.host[7].display-name = "LOWER-1"
*.host[8].display-name = "LOWER-2"

# Simulation area.
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 1050m
**.mobility.constraintAreaMaxY = 550m
**.mobility.constraintAreaMaxZ = 0m

# Fixed node positions. host[0]-host[1]-host[2]-host[3]-host[9] is the
# shortest initial route; host[4]-host[5]-host[6] forms the upper bypass.
# IMPORTANT: OMNeT++ applies the first matching ini entry. The host[2] rule must
# precede host[*], otherwise the relay is accidentally created as stationary.
*.host[2].mobility.typename = "TurtleMobility"
*.host[*].mobility.typename = "StationaryMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[0].mobility.initialX = 80m
*.host[0].mobility.initialY = 325m
*.host[1].mobility.initialX = 300m
*.host[1].mobility.initialY = 325m
*.host[3].mobility.initialX = 740m
*.host[3].mobility.initialY = 325m
*.host[4].mobility.initialX = 250m
*.host[4].mobility.initialY = 160m
*.host[5].mobility.initialX = 480m
*.host[5].mobility.initialY = 160m
*.host[6].mobility.initialX = 710m
*.host[6].mobility.initialY = 160m
*.host[7].mobility.initialX = 100m
*.host[7].mobility.initialY = 500m
*.host[8].mobility.initialX = 960m
*.host[8].mobility.initialY = 500m
*.host[9].mobility.initialX = 960m
*.host[9].mobility.initialY = 325m

# The critical relay starts at (520,325), waits, then moves downward and out of
# the central radio range. TurtleMobility must be positioned in its script;
# unlike StationaryMobility it has no initialX/initialY parameters.
*.host[2].mobility.initFromDisplayString = false
*.host[2].mobility.updateInterval = 50ms
*.host[2].mobility.updateDisplayString = true
*.host[2].mobility.displayStringTextFormat = "MOVING: p={position}, v={velocity}"
*.host[2].mobility.turtleScript = xml("<movement><set x='520' y='325'/><wait t='18'/><moveto x='520' y='500' t='6'/><wait t='12'/><moveto x='520' y='325' t='6'/><wait t='100'/></movement>")

# ---------------------- VISUALIZATION ----------------------
# Do not draw radio-medium signals or range circles. They are physical coverage
# overlays, not packet delivery, and visually look like false all-to-all links.
*.visualizer.numMediumVisualizers = 0

*.visualizer.numMobilityVisualizers = 1
*.visualizer.mobilityVisualizer[0].displayMovementTrails = true
*.visualizer.mobilityVisualizer[0].displayVelocities = true
*.visualizer.mobilityVisualizer[0].moduleFilter = "**.host[2].mobility"
*.visualizer.mobilityVisualizer[0].movementTrailLineColor = "goldenrod"
*.visualizer.mobilityVisualizer[0].movementTrailLineWidth = 4
*.visualizer.mobilityVisualizer[0].velocityLineColor = "goldenrod"
*.visualizer.mobilityVisualizer[0].velocityLineWidth = 3
*.visualizer.mobilityVisualizer[0].animationSpeed = 2

# Distinct arrows for each AODV phase and for payload traffic.
*.visualizer.numDataLinkVisualizers = 4
*.visualizer.dataLinkVisualizer[*].typename = "AcceptedHopCanvasVisualizer"
*.visualizer.dataLinkVisualizer[*].displayLinks = true
# The custom type pairs MAC sent-to-lower with MAC sent-to-upper. The inherited
# activityLevel parameter is unused by this visualizer.
*.visualizer.dataLinkVisualizer[*].activityLevel = "protocol"
*.visualizer.dataLinkVisualizer[*].fadeOutMode = "animationTime"
# Put these before wildcard timing rules because OMNeT++ uses the first match.
# RREQ/RREP pauses separate successive hops; RERR remains long enough to study;
# ping is brief so it does not cover the established route.
*.visualizer.dataLinkVisualizer[0].fadeOutTime = 0.9s
*.visualizer.dataLinkVisualizer[0].holdAnimationTime = 0.35s
*.visualizer.dataLinkVisualizer[1].fadeOutTime = 1.2s
*.visualizer.dataLinkVisualizer[1].holdAnimationTime = 0.35s
*.visualizer.dataLinkVisualizer[2].fadeOutTime = 4s
*.visualizer.dataLinkVisualizer[2].holdAnimationTime = 0.8s
*.visualizer.dataLinkVisualizer[3].fadeOutTime = 0.45s
*.visualizer.dataLinkVisualizer[3].holdAnimationTime = 0.08s
*.visualizer.dataLinkVisualizer[*].lineWidth = 4
*.visualizer.dataLinkVisualizer[*].labelFormat = "%n"
*.visualizer.dataLinkVisualizer[*].fadeOutTime = 0.55s
*.visualizer.dataLinkVisualizer[*].holdAnimationTime = 0.18s
*.visualizer.dataLinkVisualizer[0].packetFilter = "aodv::Rreq"
*.visualizer.dataLinkVisualizer[0].lineColor = "blue"
*.visualizer.dataLinkVisualizer[0].labelColor = "blue"
*.visualizer.dataLinkVisualizer[1].packetFilter = "aodv::Rrep"
*.visualizer.dataLinkVisualizer[1].lineColor = "green"
*.visualizer.dataLinkVisualizer[1].labelColor = "green"
*.visualizer.dataLinkVisualizer[2].packetFilter = "aodv::Rerr"
*.visualizer.dataLinkVisualizer[2].lineColor = "red"
*.visualizer.dataLinkVisualizer[2].labelColor = "red"
*.visualizer.dataLinkVisualizer[3].packetFilter = "ping*"
*.visualizer.dataLinkVisualizer[3].lineColor = "black"
*.visualizer.dataLinkVisualizer[3].labelColor = "black"
*.visualizer.dataLinkVisualizer[3].labelFormat = "PING"

# The currently used end-to-end path remains on screen long enough to compare
# the short route with the reconstructed bypass.
*.visualizer.numNetworkRouteVisualizers = 1
*.visualizer.networkRouteVisualizer[0].displayRoutes = true
*.visualizer.networkRouteVisualizer[0].packetFilter = "ping*"
*.visualizer.networkRouteVisualizer[0].lineColor = "black"
*.visualizer.networkRouteVisualizer[0].lineWidth = 5
*.visualizer.networkRouteVisualizer[0].fadeOutMode = "simulationTime"
*.visualizer.networkRouteVisualizer[0].fadeOutTime = 3s

# Per-node routing-table arrows are intentionally hidden: ten simultaneous
# next-hop arrows obscure RREQ/RREP and resemble a protocol broadcast mesh.
*.visualizer.numRoutingTableVisualizers = 0

# Packet losses during the broken interval are explicitly marked.
*.visualizer.numPacketDropVisualizers = 1
*.visualizer.packetDropVisualizer[0].displayPacketDrops = true
*.visualizer.packetDropVisualizer[0].packetFilter = "ping*"
# Do not visualize routine wireless overhearing (NOT_ADDRESSED_TO_US=8) or
# duplicate suppression (DUPLICATE_DETECTED=15) as failures. Show only genuine
# delivery failures that are meaningful in this experiment.
*.visualizer.packetDropVisualizer[0].detailsFilter = "reason =~ 0 or reason =~ 2 or reason =~ 4 or reason =~ 7 or reason =~ 9 or reason =~ 10 or reason =~ 11"
*.visualizer.packetDropVisualizer[0].labelFormat = "DROP: %r"
*.visualizer.packetDropVisualizer[0].iconTintColor = "red"
*.visualizer.packetDropVisualizer[0].labelColor = "red"
*.visualizer.packetDropVisualizer[0].fadeOutTime = 2s

# IP addresses beside nodes make hop-by-hop traces easy to discuss.
*.visualizer.numInterfaceTableVisualizers = 1
*.visualizer.interfaceTableVisualizer[0].displayInterfaceTables = true
*.visualizer.interfaceTableVisualizer[0].format = "%N %a"

[Config AodvMobilityDemo]
description = "10-node AODV visualization: discovery, mobility loss, RERR, and reconstructed path"
network = AodvProtocolNetwork

[Config DsdvMobilityDemo]
description = "10-node DSDV visualization: proactive updates, mobility loss, expiry, and reconstructed path"
network = DsdvProtocolNetwork
sim-time-limit = 60s

# Select INET's existing proactive DSDV implementation instead of AODV.
*.*.routingApp.typename = ""
*.*.routing.typename = "Dsdv"
*.*.routing.helloInterval = 2s
*.*.routing.routeLifetime = 5s
*.*.routing.maxVariance = 0.15
*.*.routing.broadcastDelay = uniform(0s, 0.02s)

# Allow proactive tables to converge before payload traffic begins. The same
# relay still leaves at 20 s and returns at 37 s.
*.host[0].app[0].startTime = 10s
*.host[0].app[0].sendInterval = 0.6s

# DSDV has no RREQ/RREP/RERR exchange. Every node still sends periodic
# advertisements, but highlighting all ten origins at once obscures the
# algorithm. Follow the DESTINATION-origin update as it propagates hop by hop;
# this is the information SOURCE needs in order to build its forward route.
*.visualizer.numDataLinkVisualizers = 1
*.visualizer.dataLinkVisualizer[0].packetFilter = expr(DsdvHello != nullptr && DsdvHello.srcAddress.str() == "10.0.0.10")
*.visualizer.dataLinkVisualizer[0].lineColor = "darkorange"
*.visualizer.dataLinkVisualizer[0].labelColor = "darkorange"
*.visualizer.dataLinkVisualizer[0].labelFormat = "DEST UPDATE"
*.visualizer.dataLinkVisualizer[0].fadeOutTime = 0.65s
*.visualizer.dataLinkVisualizer[0].holdAnimationTime = 0.12s

# A routing-table visualizer draws one next-hop arrow, not the complete route.
# It is deliberately disabled here because that source-to-host[1] arrow was
# easily mistaken for the whole DSDV path.
*.visualizer.numRoutingTableVisualizers = 0

# Show only the forward echo-request route. It expires before the next ping, so
# an obsolete path and its replacement can never remain on screen together.
*.visualizer.networkRouteVisualizer[0].packetFilter = "ping* and not *reply*"
*.visualizer.networkRouteVisualizer[0].lineColor = "black"
*.visualizer.networkRouteVisualizer[0].fadeOutMode = "simulationTime"
*.visualizer.networkRouteVisualizer[0].fadeOutTime = 0.45s
